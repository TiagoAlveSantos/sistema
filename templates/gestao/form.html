{% extends 'base.html' %}
{% block title %}{{ titulo }} · Sistema Mãe{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">{{ titulo }}</h1>
        <form method="post">
          {% csrf_token %}
          {% include 'partials/campos.html' %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{{ voltar_url }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
