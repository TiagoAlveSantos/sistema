{% extends 'base.html' %}
{% block title %}Cadastro · Sistema Mãe{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-2 text-center">Criar conta</h1>
        <p class="text-muted small text-center">Seu acesso será liberado após a aprovação do administrador.</p>
        <form method="post">
          {% csrf_token %}
          {% include 'partials/campos.html' %}
          <button type="submit" class="btn btn-primary w-100">Solicitar cadastro</button>
        </form>
        <p class="text-center small mt-3 mb-0">
          Já tem conta? <a href="{% url 'accounts:login' %}">Entrar</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
