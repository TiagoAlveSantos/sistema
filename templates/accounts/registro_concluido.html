{% extends 'base.html' %}
{% block title %}Cadastro enviado · Sistema Mãe{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm text-center">
      <div class="card-body p-5">
        <h1 class="h4 mb-3">Cadastro recebido!</h1>
        <p class="mb-4">Sua conta foi criada e está <strong>aguardando aprovação</strong> do administrador.
          Assim que for aprovada, você poderá entrar normalmente.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">Ir para o login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
